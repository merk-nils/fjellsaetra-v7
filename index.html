kart.fitBounds(start, {padding:[20,20]});
// Kartet kan få riktig størrelse først etter at siden er tegnet
window.addEventListener("load", () => { kart.invalidateSize(); kart.fitBounds(start, {padding:[20,20]}); });

const selG = document.getElementById("gruppe"), selS = document.getElementById("status"), sok = document.getElementById("sok");
for (const [k, v] of Object.entries(GRUPPER)) selG.add(new Option(v, k));
for (const [k, v] of Object.entries(STATUS)) selS.add(new Option(v[0], k));
document.getElementById("forklaring").innerHTML =
  Object.entries(STATUS).map(([k, v]) => `<div class="f"><span class="prikk" style="background:${v[1]}"></span>${v[0]}</div>`).join("") +
  `<div class="f"><span style="width:18px;height:0;border-top:4px solid var(--rod)"></span>V7 (hel linje) og sideveg (stiplet). Hvit stiplet linje: hyttefeltet F26A.</div>
   <div>Utvalget av tomter er laget ut fra kartet (ca.). Byggesaker før 2019 er ikke med i postlisten. Eiere vises ikke her. Eieren kan slås opp hos Kartverket (Eiendomsregisteret, krever innlogging).</div>`;

function passar(t) {
  const q = sok.value.trim().toLowerCase().replace(/\s+/g, " ");
  if (selG.value && t.gruppe !== selG.value) return false;
  if (selS.value && t.status !== selS.value) return false;
  if (!q) return true;
  const m = q.match(/^(?:29\s*[\/ ]\s*)?(\d+)(?:\s*[\/ ]\s*(\d+))?$/);
  if (m) return String(t.bnr) === m[1] && (!m[2] || String(t.fnr) === m[2]);
  return t.adr.some(a => a.toLowerCase().includes(q)) || t.mnr.toLowerCase().includes(q);
}

let valt = null;
function vel(id, zoom) {
  valt = id;
  document.querySelectorAll(".tomt").forEach(e => e.classList.toggle("valt", e.dataset.id == id));
  const e = document.querySelector(`.tomt[data-id="${id}"]`);
  if (e) e.scrollIntoView({block:"nearest"});
  if (zoom) { kart.fitBounds(lag[id].getBounds(), {maxZoom:18}); lag[id].openPopup(); }
}

function teikn() {
  const vis = DATA.tomter.filter(passar);
  for (const t of DATA.tomter) {
    const p = vis.includes(t);
    lag[t.id].setStyle({fillOpacity: p ? (t.gruppe === "grunn" ? 0.05 : (t.status === "ingen" ? 0.25 : 0.6)) : 0.03, opacity: p ? 1 : 0.15});
  }
  const sortert = [...vis].sort((a, b) => (a.status === "loyve" ? 0 : 1) - (b.status === "loyve" ? 0 : 1) || a.bnr - b.bnr || a.fnr - b.fnr);
  document.getElementById("liste").innerHTML = sortert.map(t => `
    <div class="tomt" data-id="${t.id}">
      <span class="prikk" style="background:${STATUS[t.status][1]}"></span>
      <div><b>${esc(t.mnr)}</b>${t.adr.length ? " · " + esc(t.adr[0]) : ""}
        <div class="sm">${STATUS[t.status][0]}${t.loyve ? " · IG " + t.loyve[0] : ""}${t.ferdig ? " · FA " + t.ferdig[0] : ""}</div></div>
      <span class="merke">${GRUPPER[t.gruppe]}</span>
    </div>`).join("");
  document.querySelectorAll(".tomt").forEach(e => e.onclick = () => vel(+e.dataset.id, true));
  const n = s => vis.filter(t => t.status === s && t.gruppe !== "grunn").length;
  document.getElementById("tal").textContent =
    `${vis.length} teiger · ${n("loyve")} med tillatelse uten ferdigattest · ${n("ferdig")} med ferdigattest · ${n("soknad")} søknader`;
  if (vis.length === 1) vel(vis[0].id, true);
}
[sok, selG, selS].forEach(e => e.addEventListener("input", teikn));
teikn();
</script>
</body>
</html>
